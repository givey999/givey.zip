<!doctype html>
<html lang="en">

          "url": "https://givey.zip/",
          "name": "givey",
          "description": "givey — wanna be web developer. Personal site, projects, and socials."
        },
        {
          "@type": "Person",
          "@id": "https://givey.zip/#person",
          "name": "givey",
          "alternateName": "givey02",
          "url": "https://givey.zip/",
          "description": "wanna be web developer",
          "image": "https://givey.zip/assets/icon.jpg",
          "sameAs": [
            "https://www.instagram.com/afk.luca/",
            "https://steamcommunity.com/id/givey02/",

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <video id="background" autoplay muted loop playsinline></video>
    <canvas class="sparkles" aria-hidden="true"></canvas>
    <img class="custom-cursor" src="assets/cursor.png" alt="" aria-hidden="true" />

    <audio id="player-audio" preload="auto" loop></audio>

    <main id="app" hidden>
      <div class="tilt-group">
        <div class="card-stack">
          <div class="face front">
            <section class="profile-card">
              <div class="banner"></div>
              <img class="pfp" alt="givey" />
              <div class="name-row">
                <span class="name">givey</span>
                <svg class="verified" viewBox="0 0 24 24" aria-label="verified">
                  <path fill="currentColor" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34z"/>
                  <path fill="#ffffff" d="M10.54 16.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/>
                </svg>
              </div>
              <div class="bio"><span class="bio-text"></span><span class="cursor">|</span></div>
              <div class="views" aria-label="page views">
                <svg class="views-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <span class="views-count">—</span>
              </div>
              <div class="socials"></div>
              <div class="flip-links">
                <a class="flip-link" data-flip-to="about" href="#about"><svg class="flip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> about</a>
                <a class="flip-link" data-flip-to="projects" href="#projects">see projects →</a>
              </div>
            </section>

            <section class="discord-card" data-state="loading">
              <div class="discord-placeholder">loading…</div>
            </section>
          </div>

          <div class="face back">
            <section class="projects-card">
              <header class="projects-header">
                <span class="projects-title">projects</span>
                <a class="flip-link back" data-flip-to="front" href="#">← back</a>
              </header>
              <div class="projects-list"></div>
            </section>

            <section class="about-card" hidden>
              <header class="about-header">
                <a class="flip-link back" data-flip-to="front" href="#">← back</a>
                <span class="about-title">about</span>
              </header>
              <div class="about-body"></div>
            </section>
          </div>
        </div>

        <section class="music-player"></section>
      </div>
    </main>

    <div id="splash">
      <span class="splash-text">click to join heaven</span>
    </div>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
