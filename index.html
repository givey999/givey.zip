<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>givey</title>
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <link rel="apple-touch-icon" href="assets/icon.png" />
    <meta name="description" content="wanna be web developer" />
    <meta name="theme-color" content="#101013" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <video id="background" autoplay muted loop playsinline></video>
    <canvas class="sparkles" aria-hidden="true"></canvas>
    <img class="custom-cursor" src="assets/cursor.png" alt="" aria-hidden="true" />

    <audio id="player-audio" preload="auto"></audio>

    <main id="app" hidden>
      <div class="tilt-group">
        <div class="card-stack">
          <div class="face front">
            <section class="profile-card">
              <div class="banner" style="background-image: url('assets/banner.gif')"></div>
              <img class="pfp" src="assets/pfp.jpg" alt="givey" />
              <div class="name-row">
                <span class="name">givey</span>
              </div>
              <div class="bio"><span class="bio-text"></span><span class="cursor">|</span></div>
              <div class="socials"></div>
              <div class="flip-links">
                <a class="flip-link" data-flip-to="crypto" href="#crypto"><svg class="flip-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.638 14.904c-1.602 6.43-8.113 10.34-14.542 8.736C2.67 22.05-1.244 15.525.362 9.105 1.962 2.67 8.475-1.243 14.9.358c6.43 1.605 10.342 8.115 8.738 14.548v-.002zm-6.35-4.613c.24-1.59-.974-2.45-2.64-3.03l.54-2.153-1.315-.33-.525 2.107c-.345-.087-.7-.168-1.053-.254l.53-2.12-1.32-.33-.54 2.165c-.285-.065-.565-.13-.84-.2l-1.815-.45-.35 1.407s.975.224.955.238c.535.136.63.486.615.766l-.617 2.467c.037.01.085.023.137.047l-.14-.036-.865 3.46c-.067.16-.23.4-.6.31.015.02-.96-.24-.96-.24l-.66 1.51 1.71.426.93.242-.54 2.19 1.32.327.54-2.17c.36.1.705.19 1.05.273l-.54 2.15 1.32.33.545-2.19c2.24.427 3.93.254 4.64-1.774.57-1.637-.03-2.58-1.217-3.196.854-.193 1.5-.749 1.67-1.898zm-2.99 4.2c-.404 1.64-3.157.75-4.05.53l.72-2.9c.896.227 3.757.67 3.33 2.37zm.41-4.22c-.37 1.49-2.662.735-3.405.548l.654-2.64c.744.18 3.137.524 2.75 2.084z"/></svg> crypto</a>
                <a class="flip-link" data-flip-to="projects" href="#projects">see projects →</a>
              </div>
            </section>

            <section class="discord-card" data-state="loading">
              <div class="discord-placeholder">loading…</div>
            </section>
          </div>

          <div class="face back">
            <section class="projects-card">
              <header class="projects-header">
                <span class="projects-title">projects</span>
                <a class="flip-link back" data-flip-to="front" href="#">← back</a>
              </header>
              <div class="projects-list"></div>
            </section>

            <section class="crypto-card" hidden>
              <header class="crypto-header">
                <a class="flip-link back" data-flip-to="front" href="#">back →</a>
                <span class="crypto-title">crypto</span>
              </header>
              <div class="crypto-list"></div>
            </section>
          </div>
        </div>

        <section class="music-player"></section>
      </div>
    </main>

    <div id="splash">
      <span class="splash-text">click to join heaven</span>
    </div>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
